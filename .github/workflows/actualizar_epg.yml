name: Actualizar EPG Perú Diariamente

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 04:00 AM (Hora de Perú / 09:00 UTC)
    # y a las 04:00 PM (Hora de Perú / 21:00 UTC)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un clic desde la pestaña "Actions"

permissions:
  contents: write

jobs:
  build-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generar guía EPG Peruana (epg_peru.xml)
        run: python generar_epg_peru.py

      - name: Guardar y publicar EPG actualizado en GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add epg_peru.xml epg_peru.xml.gz epg.xml
          git diff --staged --quiet || git commit -m "Auto-update EPG Perú: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
